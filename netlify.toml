[build]
  command = "npm ci && npm run build"
  publish = "dist"

# SPA fallback для клиентского роутинга (React Router / Vue Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true
  conditions = {Language = ["ru", "en"]}

# Проксируем API на бэкенд, чтобы фронт дергал относительный /api/ и не было CORS
[[redirects]]
  from = "/api/*"
  to = "https://rasa-backend-6dpd.onrender.com/:splat"
  status = 200
  force = true
